# -----------------------------------------------------------------------------
# Global options
# -----------------------------------------------------------------------------

# Set a new prefix / leader key.
set -g prefix `
bind ` send-prefix
#set -g prefix C-s
#bind -r C-s send-prefix

# Enable color support inside of tmux.
#set -g default-terminal "screen-256color"
#set -g default-terminal "xterm-256color"
#set-option -ga terminal-overrides ",st-256color:Tc"
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB,tmux-256color:RGB'

# Disable automatic window renaming so names stay fixed.
setw -g automatic-rename off

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Enable full mouse support.
set -g mouse on

# Scroll History
set -g history-limit 9999

# ── Status bar ──
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour183,bold] #S #[fg=colour242]│ "
set -g status-right " #[fg=colour111]#{b:pane_current_path}"
set -g status-left-length 50
set -g status-right-length 50
set -g window-status-format " #{?#{==:#{@claude_state},busy},#[fg=colour208]● ,#{?#{==:#{@claude_state},done},#[fg=colour46]✓ ,}}#[fg=colour245]#I:#W "
set -g window-status-current-format " #{?#{==:#{@claude_state},busy},#[fg=colour208]● ,#{?#{==:#{@claude_state},done},#[fg=colour46]✓ ,}}#[fg=colour183,bold]#I:#W "
set -g window-status-separator "#[fg=colour242]│"

# Claude Code activity indicator: clear the 'done' marker once the window is focused.
set-hook -g after-select-window 'if -F "#{==:#{@claude_state},done}" "set-option -w -u @claude_state"'

# don't rename windows automatically
set-option -g allow-rename off

# Remove delay when switching between Vim modes.
set -s escape-time 0

# Recover Vim sessions.
set -g @resurrect-strategy-vim 'session'

# Auto save sessions.
set -g @continuum-restore 'on'
# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# Unbind default keys
unbind C-b
unbind '"'
unbind %

# Reload the tmux config.
#bind-key r source-file ~/.tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Split panes.
bind-key "'" split-window -h
bind-key / split-window -v

# Move around panes with ALT + arrow keys.
bind-key -n M-Up select-pane -U
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Right select-pane -R

# Move around panes with vim-like keys
setw -g mode-keys vi
#bind-key -n C-k select-pane -U
#bind-key -n C-h select-pane -L
#bind-key -n C-j select-pane -D
#bind-key -n C-l select-pane -R

# Clear screen
bind C-l send-keys 'C-l'

# Move around panes with prefix + vim arrows.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

setw -gq utf8 on

set -g @yank_selection_mouse 'clipboard'

# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# -----------------------------------------------------------------------------
# Plugin Manager - https://github.com/tmux-plugins/tpm
# In order to use the plugins below you need to install TPM and the plugins.
#   Step 1) git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   Step 2) Reload tmux if it's already started with `r
#   Step 3) Launch tmux and hit `I (capital i) to fetch any plugins
# -----------------------------------------------------------------------------

# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'


# Initialize TPM (keep this line at the very bottom of your tmux.conf).
run -b '~/.tmux/plugins/tpm/tpm'

# Extended keys disabled: tmux's extended-keys machinery re-encodes '\n' (= Ctrl+J)
# bytes inside bracketed paste once Claude Code negotiates the kitty keyboard
# protocol, turning a pasted newline into a literal 'j'. With this off, tmux passes
# Ghostty's '\e[13;2u' (Shift+Enter) through verbatim, so Shift+Enter still inserts
# a newline in Claude Code without going through a tmux binding.
# See https://github.com/anthropics/claude-code/issues/43169
set -s extended-keys off

bind-key -n BTab send-keys "\e[Z"
bind-key -n S-Tab send-keys "\e[Z"
